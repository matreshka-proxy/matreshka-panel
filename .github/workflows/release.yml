name: Signed release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache-dependency-path: agent/go.sum
      - name: Validate tag and install dependencies
        run: |
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          test "$version" = "$(bun -e 'console.log(require("./package.json").version)')"
          git fetch origin main --no-tags --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          bun install --frozen-lockfile
      - name: Test application and agent
        run: |
          bun run check
          (cd agent && go test ./...)
      - name: Build release archive
        run: |
          version="${RELEASE_TAG#v}"
          MATRESHKA_VERSION="$version" bun run release:linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: release/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  sign-and-publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: release
      - name: Sign and verify archive
        run: |
          test -n "$MINISIGN_SECRET_KEY"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          archive="$(find release -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          test -n "$archive"
          minisign -S -W -s "$key" -m "$archive" -x "${archive}.minisig" -t "Matreshka ${RELEASE_TAG#v} linux-amd64"
          minisign -Vm "$archive" -x "${archive}.minisig" -p infra/release/minisign.pub
          sha256sum "$archive" >"${archive}.sha256"
          rm -f "$key"
      - name: Publish immutable GitHub Release
        run: |
          archive="$(find release -maxdepth 1 -name '*.tar.gz' -type f -print -quit)"
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$archive" "${archive}.minisig" "${archive}.sha256" \
            --verify-tag \
            --title "Matreshka ${RELEASE_TAG#v}" \
            "${prerelease[@]}" \
            --generate-notes
